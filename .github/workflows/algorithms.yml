name: Algorithms

on:
  push:
  pull_request:

jobs:
  strict-deterministic-regressions:
    strategy:
      matrix:
        include:
          - algorithm: identity
            test_file: tests/integration/test_algorithm_identity_strict_regression.py
            needs_odd_geometry: false
          - algorithm: merge_within_cell
            test_file: tests/integration/test_algorithm_merge_within_cell_strict_regression.py
            needs_odd_geometry: false
          - algorithm: merge_within_regular_subcell_weighted_3x3
            test_file: tests/integration/test_algorithm_merge_within_regular_subcell_weighted_strict_regression.py
            needs_odd_geometry: true
          - algorithm: merge_within_regular_subcell_center_3x3
            test_file: tests/integration/test_algorithm_merge_within_regular_subcell_center_strict_regression.py
            needs_odd_geometry: true
          - algorithm: cluster_within_cell_agglomerative
            test_file: tests/integration/test_algorithm_cluster_within_cell_agglomerative_strict_regression.py
            needs_odd_geometry: false
    runs-on: ubuntu-22.04
    name: strict/${{ matrix.algorithm }}
    steps:
      - uses: actions/checkout@v4
      - name: Clone OpenDataDetector
        if: ${{ matrix.needs_odd_geometry }}
        run: git clone --depth 1 https://gitlab.cern.ch/acts/OpenDataDetector.git OpenDataDetector
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,test]
      - name: Run strict algorithm regression
        run: pytest -q ${{ matrix.test_file }}
      - name: Upload strict regression outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strict-${{ matrix.algorithm }}-outputs
          path: |
            /tmp/pytest-of-*/pytest-*/test_*/pipeline_out_*/compressed_*.h5
            /tmp/pytest-of-*/pytest-*/test_*/pipeline_out_*/compression_summary_*.txt

  strict-nondeterministic-diagnostics:
    strategy:
      matrix:
        include:
          - algorithm: hdbscan
            test_file: tests/integration/test_algorithm_hdbscan_strict_regression.py
    runs-on: ubuntu-22.04
    continue-on-error: true
    name: strict/${{ matrix.algorithm }} (diagnostic)
    env:
      STEP2POINT_ENABLE_STRICT_HDBSCAN: "1"
      # HDBSCAN output depends on the order of tied MST edges, which numpy's argsort leaves to the
      # CPU-dispatched sort; disables AVX-512 dispatch so numpy falls back to the AVX2 path the reference was produced with.
      NPY_DISABLE_CPU_FEATURES: "X86_V4 AVX512_ICL"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,test] -c tests/ci/constraints-strict-hdbscan.txt
      - name: Print CPU and numerical environment
        run: |
          lscpu | grep -E 'Model name|Architecture'
          echo "--- AVX flags the hardware supports:"
          lscpu | grep -o 'avx[^ ]*' | sort -u || echo "no avx flags"
          echo "--- numpy runtime (after NPY_DISABLE_CPU_FEATURES):"
          python -c "import numpy; numpy.show_runtime()"
          echo "--- versions:"
          python -c "import sklearn; sklearn.show_versions()"
      - name: Run strict algorithm diagnostic
        run: pytest -q ${{ matrix.test_file }}
      - name: Upload strict diagnostic outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strict-${{ matrix.algorithm }}-diagnostic-outputs
          path: |
            /tmp/pytest-of-*/pytest-*/test_*/pipeline_out_*/compressed_*.h5
            /tmp/pytest-of-*/pytest-*/test_*/pipeline_out_*/compression_summary_*.txt

  loose-regressions:
    strategy:
      matrix:
        include:
          - algorithm: hdbscan
            test_file: tests/integration/test_algorithm_hdbscan_loose_regression.py
    runs-on: ubuntu-latest
    name: loose/${{ matrix.algorithm }}
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,test]
      - name: Run loose algorithm regression
        run: pytest -q ${{ matrix.test_file }}
      - name: Upload loose regression outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loose-${{ matrix.algorithm }}-outputs
          path: |
            /tmp/pytest-of-*/pytest-*/test_*/pipeline_out_*/compressed_*.h5
            /tmp/pytest-of-*/pytest-*/test_*/pipeline_out_*/compression_summary_*.txt
